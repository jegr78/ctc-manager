services:
  db:
    image: ${CTC_DATABASE_IMAGE:?Select a tested MariaDB digest}
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MARIADB_DATABASE: ctcdb
      MARIADB_USER: ctc
      MARIADB_PASSWORD_FILE: /run/secrets/db-password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    volumes:
      - database:/var/lib/mysql
      - dbsocket:/run/mysqld
      - ${CTC_DB_PASSWORD_FILE:?Missing DB secret}:/run/secrets/db-password:ro
      - ${CTC_DB_ROOT_PASSWORD_FILE:?Missing DB root secret}:/run/secrets/db-root-password:ro
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db-exporter-account:
    image: ${CTC_DATABASE_IMAGE:?Select a tested MariaDB digest}
    user: '0:0'
    network_mode: none
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dbsocket:/run/mysqld
      - ${CTC_DB_ROOT_PASSWORD_FILE:?Missing DB root secret}:/run/secrets/db-root-password:ro
    entrypoint: [/bin/sh, -ec]
    # Runs on every start because restore replaces the database volume.
    # unix_socket admits only processes running as the database image's uid 999 (mysql).
    command:
      - |
        MYSQL_PWD="$$(cat /run/secrets/db-root-password)" exec mariadb --user=root --socket=/run/mysqld/mysqld.sock <<SQL
        CREATE USER IF NOT EXISTS 'mysql'@'localhost' IDENTIFIED VIA unix_socket WITH MAX_USER_CONNECTIONS 3;
        ALTER USER 'mysql'@'localhost' IDENTIFIED VIA unix_socket WITH MAX_USER_CONNECTIONS 3;
        REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'mysql'@'localhost';
        GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'mysql'@'localhost';
        GRANT SELECT ON performance_schema.* TO 'mysql'@'localhost';
        SQL
    logging: *logging
  db-exporter:
    image: prom/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
    restart: unless-stopped
    user: '999:999'
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/run/exporter:size=1m,mode=0700,uid=999']
    depends_on:
      db-exporter-account:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: dbsocket
        target: /run/mysqld
        read_only: true
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        printf '[client]\nuser=mysql\nsocket=/run/mysqld/mysqld.sock\n' > /run/exporter/my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/run/exporter/my.cnf --no-collect.slave_status
    ports:
      - 127.0.0.1:9191:9104
    networks: [metrics]
    logging: *logging
  credentials-init:
    image: ${CTC_APP_IMAGE:?Select a released CTC digest}
    user: '0:0'
    network_mode: none
    mem_limit: 64m
    read_only: true
    entrypoint: [/bin/sh, -ec]
    command:
      - install -m 0400 -o "$$(id -u ctc)" -g "$$(id -g ctc)" /run/source/google.json /run/ctc/google-credentials.json
    volumes:
      - ${CTC_GOOGLE_FILE:?Missing Google credential file}:/run/source/google.json:ro
      - credentials:/run/ctc
    logging: *logging
  app:
    image: ${CTC_APP_IMAGE:?Select a released CTC digest}
    restart: unless-stopped
    mem_limit: 2g
    env_file: ["${CTC_APP_ENV_FILE:?Missing private app environment}"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CTC_OUTBOUND_ENABLED: ${CTC_OUTBOUND_ENABLED:-true}
      DATABASE_URL: jdbc:mariadb://db:3306/ctcdb?rewriteBatchedStatements=true
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError -Duser.timezone=Europe/Berlin
      TZ: Europe/Berlin
      GOOGLE_SHEETS_CREDENTIALS_PATH: /run/ctc/google-credentials.json
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS: 'true'
    ports:
      - 127.0.0.1:9092:8080
      - 127.0.0.1:9190:8081
    volumes:
      - data:/app/data
      - logs:/app/logs
      - credentials:/run/ctc:ro
    networks: [database, outbound]
    depends_on:
      db:
        condition: service_healthy
      credentials-init:
        condition: service_completed_successfully
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging: *logging
networks:
  database:
    internal: true
  outbound: {}
  metrics: {}
volumes:
  dbsocket: {}
  database:
    name: ${CTC_DATABASE_VOLUME:-ctc-manager_database}
  data:
    name: ${CTC_DATA_VOLUME:-ctc-manager_data}
  logs:
    name: ${CTC_LOGS_VOLUME:-ctc-manager_logs}
  credentials:
    name: ${CTC_CREDENTIALS_VOLUME:-ctc-manager_credentials}
