name: CodeQL SAST

on:
  push:
    branches: [master]
    paths-ignore:
      - '.planning/**'
      - '*.md'
      - 'docs/**'
      - '.gitmessage'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.planning/**'
      - '*.md'
      - 'docs/**'
      - '.gitmessage'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for CodeQL
        run: ./mvnw compile --no-transfer-progress -DskipTests -Dspring.profiles.active=dev

      - name: Record the analysis start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

      - name: Gate on new HIGH/CRITICAL security alerts
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'master' }}
          OWNER_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ANALYSIS_STARTED_AT: ${{ steps.started.outputs.at }}
        run: bash scripts/ci/codeql-gate.sh
