name: Release

# Releases only a master revision whose required checks all succeeded. Every completed CI or
# CodeQL run on a master push triggers this workflow; the gate skips until both are done.
on:
  workflow_run:
    workflows: [CI, CodeQL SAST]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Master revision to evaluate (default: the tip of master).'
        required: false
        type: string
      dry-run:
        description: 'Dry-run: run the gate and the version determination, skip build/tag/release/docker/snapshot.'
        required: false
        type: boolean
        default: false

# One release at a time; a newer waiting run replaces an older waiting one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  checks: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      REQUIRED_CHECKS: |
        build-and-test
        dockerfile-noble-pin-guard
        docker-build
        Analyze (java-kotlin)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'master' }}
          fetch-depth: 0
          fetch-tags: true          # required so `git tag` returns remote tags
          # PAT with repo scope — required to push past branch protection
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Gate on the checks of this revision
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        run: SHA=$(git rev-parse HEAD) bash scripts/ci/release-gate.sh

      - name: Setup JDK 25
        if: steps.gate.outputs.decision == 'release'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine version
        id: version
        if: steps.gate.outputs.decision == 'release'
        run: SHA=$(git rev-parse HEAD) bash scripts/ci/release-version.sh

      - name: Plan the remaining release steps
        id: plan
        if: steps.gate.outputs.decision == 'release' && steps.version.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ctc-manager
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run: release v${VERSION} would be published"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "github_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "github_release=true" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.plan.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version in pom.xml
        if: steps.plan.outputs.publish == 'true' && steps.version.outputs.resume != 'true'
        run: ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.new_version }} -DgenerateBackupPoms=false

      - name: Check out the release tag of the earlier attempt
        if: steps.plan.outputs.publish == 'true' && steps.version.outputs.resume == 'true'
        run: git checkout --quiet "v${{ steps.version.outputs.new_version }}"

      - name: Build and verify
        if: steps.plan.outputs.publish == 'true' && (steps.version.outputs.resume != 'true' || steps.plan.outputs.github_release == 'true')
        run: ./mvnw verify -Dspring.profiles.active=dev

      # The release commit, its tag and master move together, so a failed push leaves nothing behind.
      - name: Push release commit and tag
        if: steps.plan.outputs.publish == 'true' && steps.version.outputs.resume != 'true'
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          git add pom.xml
          git commit -m "release: v${VERSION}" -m "[skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --atomic origin HEAD:master "v${VERSION}"

      - name: Create GitHub Release
        if: steps.plan.outputs.github_release == 'true'
        env:
          # The PAT authors the Release page as the operator, not github-actions[bot].
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes \
            target/ctc-manager-${{ steps.version.outputs.new_version }}.jar

      - name: Login to GHCR
        if: steps.plan.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.plan.outputs.image == 'true'
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          IMAGE=ghcr.io/${{ github.repository_owner }}/ctc-manager

          docker build -t ${IMAGE}:${VERSION} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:latest

      - name: Bump to next SNAPSHOT
        if: steps.plan.outputs.publish == 'true'
        run: |
          git fetch --quiet origin master
          git checkout --quiet --force origin/master
          current=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "${current}" != "${{ steps.version.outputs.new_version }}" ]; then
            echo "master is already at ${current}, nothing to bump"
            exit 0
          fi
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.next_snapshot }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_snapshot }} [skip ci]"
          git push origin HEAD:master
