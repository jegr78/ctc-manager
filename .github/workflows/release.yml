name: Release

# Releases only a master revision whose required checks all succeeded. Every completed CI or
# CodeQL run on a master push triggers this workflow; the gate skips until both are done.
on:
  workflow_run:
    workflows: [CI, CodeQL SAST]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Master revision to evaluate (default: the latest master commit).'
        required: false
        type: string
      dry-run:
        description: 'Dry-run: run the gate and the version determination, skip build/tag/release/docker/snapshot.'
        required: false
        type: boolean
        default: false

# One release at a time; a newer waiting run replaces an older waiting one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      REQUIRED_JOBS: |
        .github/workflows/ci.yml:build-and-test
        .github/workflows/ci.yml:dockerfile-noble-pin-guard
        .github/workflows/ci.yml:docker-build
        .github/workflows/codeql.yml:Analyze (java-kotlin)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}
          fetch-depth: 0
          fetch-tags: true          # required so `git tag` returns remote tags
          persist-credentials: false

      - name: Select the revision of a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED: ${{ inputs.sha }}
        run: |
          if [ -n "${REQUESTED}" ]; then
            sha=$(git rev-parse --verify "${REQUESTED}^{commit}")
          else
            sha=$(git log --format='%H %s' origin/master \
              | awk '$2 != "release:" && !($2 == "chore:" && $3 == "bump") && !found { print $1; found = 1 }')
          fi
          git merge-base --is-ancestor "${sha}" origin/master || { echo "::error::${sha} is not on master"; exit 1; }
          git checkout --quiet "${sha}"

      - name: Gate on the checks of this revision
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        run: SHA=$(git rev-parse HEAD) bash scripts/ci/release-gate.sh

      - name: Setup JDK 25
        if: steps.gate.outputs.decision == 'release'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine version
        id: version
        if: steps.gate.outputs.decision == 'release'
        run: SHA=$(git rev-parse HEAD) bash scripts/ci/release-version.sh

      - name: Login to GHCR
        if: steps.gate.outputs.decision == 'release' && steps.version.outputs.should_skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan the remaining release steps
        id: plan
        if: steps.gate.outputs.decision == 'release' && steps.version.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ctc-manager
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run: release v${VERSION} would be published"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "github_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "github_release=true" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the release version for the build
        if: steps.plan.outputs.publish == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.version.outputs.new_version }} -DgenerateBackupPoms=false

      # ci.yml already tested this revision; the release only builds it with the release version.
      - name: Build
        if: steps.plan.outputs.publish == 'true'
        run: ./mvnw -B package -DskipTests

      - name: Create GitHub Release
        if: steps.plan.outputs.github_release == 'true'
        env:
          # The PAT authors the Release page and its tag as the operator, not github-actions[bot].
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          gh release create "v${VERSION}" --draft --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" --generate-notes "target/ctc-manager-${VERSION}.jar"

      - name: Build and push Docker image
        if: steps.plan.outputs.image == 'true'
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          IMAGE=ghcr.io/${{ github.repository_owner }}/ctc-manager

          docker build -t ${IMAGE}:${VERSION} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:latest

      - name: Package and publish deployment material
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ctc-manager
          app_digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          database_image=$(cat deploy/database-image)
          database_digest=${database_image#*@}
          python3 scripts/ci/deployment-bundle.py create --version "${VERSION}" \
            --app-digest "${app_digest}" --database-digest "${database_digest}" --output target/deployment
          bash scripts/ci/publish-deployment.sh "${VERSION}" target/deployment

      # Deploy resolves only published releases, so publish once the bundle is complete.
      - name: Publish GitHub Release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: gh release edit "v${VERSION}" --draft=false
