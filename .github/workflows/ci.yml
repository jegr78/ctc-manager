name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'pom.xml'
              - 'lombok.config'
              - '.gitattributes'
              - 'config/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'rewrite.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
            docs:
              - '.planning/**'
              - '*.md'
              - 'docs/**'
              - '!docs/site/**'
              - '.gitmessage'

  prepare-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Compile shared source and discover the complete test inventory
        run: |
          ./mvnw clean test-compile dependency:build-classpath -DincludeScope=test -Dmdep.outputFile=target/ci-classpath.txt --no-transfer-progress
          java -cp "target/test-classes:target/classes:$(cat target/ci-classpath.txt)" org.ctc.testsupport.CiTestInventory target/ci-inventory.tsv
          python3 scripts/ci/test-partitions.py plan
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-test-source
          path: |
            target/classes/
            target/test-classes/
            target/maven-status/
            target/generated-sources/
            target/generated-test-sources/
            target/ci-plan/
          retention-days: 7
          if-no-files-found: error

  test-core:
    needs: [changes, prepare-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-partition
        with:
          group: core

  test-mariadb-1:
    needs: [changes, prepare-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-partition
        with:
          group: mariadb-1

  test-mariadb-2:
    needs: [changes, prepare-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-partition
        with:
          group: mariadb-2

  test-browser:
    needs: [changes, prepare-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-partition
        with:
          group: browser

  build-and-test:
    needs: [changes, prepare-tests, test-core, test-mariadb-1, test-mariadb-2, test-browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path check
        if: needs.changes.result != 'success'
        run: |
          echo "The changes job ended with '${{ needs.changes.result }}', so this check cannot pass."
          exit 1
      - uses: actions/checkout@v7
      - name: Require every expected test group
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/test-partitions.py jobs
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.code == 'true'
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.code == 'true'
        with:
          name: compiled-test-source
          path: target
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: test-partition-*
          path: target/ci-results
      - name: Verify inventory and merge coverage through the normal verification lifecycle
        if: needs.changes.outputs.code == 'true'
        run: |
          python3 scripts/ci/test-partitions.py aggregate target/ci-results
          ./mvnw verify -Pci-aggregate --no-transfer-progress -Dspring.profiles.active=dev
          python3 scripts/ci/test-partitions.py aggregate target/ci-results
      - name: JaCoCo Coverage Report
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 80
          title: "Coverage Report"
          update-comment: true
      - name: Upload aggregate coverage and test evidence
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/ci-plan/
            target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: error

  dockerfile-noble-pin-guard:
    # Structural guard for the eclipse-temurin -noble suffix pin in Dockerfile.
    # Fails if any `FROM eclipse-temurin:` line does not end in `-noble`.
    # Whitelist-on-suffix approach. Cross-platform grep idiom mirrors pom.xml PLAT-07
    # build-guard (commit f451ff4).
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require a successful path check
        if: needs.changes.result != 'success'
        run: |
          echo "The changes job ended with '${{ needs.changes.result }}', so this check cannot pass."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Dockerfile -noble pin guard
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          # Extract every FROM eclipse-temurin: line (anchored regex via grep -E, cross-platform).
          from_lines=$(grep -E '^FROM eclipse-temurin:' Dockerfile || true)
          if [ -z "$from_lines" ]; then
            echo "[noble-pin-guard] ERROR: No 'FROM eclipse-temurin:' lines found in Dockerfile."
            echo "Either the base image was changed away from eclipse-temurin (update this guard) or the Dockerfile is missing."
            exit 1
          fi
          # Whitelist: every FROM eclipse-temurin: line MUST contain the fixed substring '-noble'.
          # Two-stage extract-then-filter mirrors pom.xml PLAT-07 (commit f451ff4):
          # grep -E extracts the candidate set; grep -F is the cross-platform fixed-string filter.
          # NOTE: pass the leading-dash pattern via -e to avoid BSD-grep parsing '-noble' as flags
          # (the exact portability trap commit f451ff4 documented for the Thymeleaf build-guard).
          violations=$(printf '%s\n' "$from_lines" | grep -v -F -e '-noble' || true)
          if [ -n "$violations" ]; then
            echo "[noble-pin-guard] FAIL: Dockerfile uses an unpinned eclipse-temurin tag."
            echo "All 'FROM eclipse-temurin:' lines must end in '-noble' (e.g. '25-jdk-noble', '25-jre-noble')."
            echo "Reason: Playwright 1.59.0 does not support Ubuntu 26.04 (Plucky), which the bare '25-jre' tag silently rotated to in release run 25609204039."
            echo "See Dockerfile and its comment block for the -noble pin rationale."
            echo ""
            echo "Offending line(s):"
            echo "$violations"
            exit 1
          fi
          echo "[noble-pin-guard] OK - all 'FROM eclipse-temurin:' lines are pinned to -noble."
          echo "$from_lines"

  docker-build:
    # Exercises `docker build .` on every PR + push to master so Dockerfile / base-image
    # regressions fail fast on PR instead of on release. In particular, exercises stage 2's
    # `playwright install chromium` RUN step — the exact step that failed in release run
    # 25609204039 before the -noble pin.
    # Full build job, always on. Acceptable cost: +1-3 minutes CI per PR.
    needs: [changes, dockerfile-noble-pin-guard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require a successful path check
        if: needs.changes.result != 'success' || needs.dockerfile-noble-pin-guard.result != 'success'
        run: |
          echo "The changes job ended with '${{ needs.changes.result }}' and the pin guard with '${{ needs.dockerfile-noble-pin-guard.result }}', so this check cannot pass."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image (full multi-stage, no push)
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ctc-manager:ci-${{ github.sha }}
          cache-from: type=gha,scope=ctc-docker
          cache-to: type=gha,scope=ctc-docker,mode=max

      - name: Verify private recovery storage and flush failures
        if: needs.changes.outputs.code == 'true'
        run: |
          python3 deploy/tests/native_files.py --app-image "ctc-manager:ci-${{ github.sha }}" \
            --docker-host unix:///var/run/docker.sock --directory "$RUNNER_TEMP/ctc-recovery-files"
