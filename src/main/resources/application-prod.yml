spring:
  datasource:
    # DATABASE_URL must include rewriteBatchedStatements=true
    # (e.g. jdbc:mariadb://host:3306/db?rewriteBatchedStatements=true) so
    # JdbcTemplate.batchUpdate(...)=500 compiles into a single multi-row INSERT on MariaDB.
    url: ${DATABASE_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration

app:
  upload-dir: /app/data/uploads
  trailer:
    cutout-model-path: /opt/ctc/models/cutout.onnx
  backup:
    staging-dir: /app/data/backup-staging
    import-backups-dir: /app/data/import-backups

ctc:
  site:
    output-dir: /app/data/site
    public-base-url: ${CTC_SITE_PUBLIC_BASE_URL:https://jegr78.github.io/ctc-manager/}
    publication:
      directory: /app/data/site-publication
