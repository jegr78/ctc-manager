<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Cars', ~{::section})}">
<body>
<section class="admin-list catalog-list" data-admin-list data-page-size="20" data-unit="car" data-plural="cars">
    <div class="toolbar">
        <h1>Cars</h1>
        <div class="actions">
            <a th:href="@{/admin/cars/new}" class="btn btn-primary">+ New Car</a>
        </div>
    </div>
    <p class="admin-list-intro text-dim">Manage the cars available for race setup.</p>
    <div class="card admin-list-card">
        <div class="admin-list-controls catalog-list-controls" data-list-tools hidden>
            <label for="carSearch"><span>Search</span><input type="search" id="carSearch" data-list-search placeholder="Manufacturer or car name" autocomplete="off"></label>
            <button type="button" class="btn btn-secondary" data-list-reset disabled>Reset filters</button>
            <p class="admin-list-count text-dim" data-list-count role="status"></p>
        </div>
        <div class="table-scroll" role="region" aria-label="Cars list" tabindex="0">
        <table th:if="${!cars.isEmpty()}" id="carsTable" data-list-table>
            <thead>
                <tr>
                    <th scope="col" class="col-thumb">Image</th>
                    <th scope="col" class="sortable" data-col="1" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Manufacturer" disabled>Manufacturer</button></th>
                    <th scope="col" class="sortable" data-col="2" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Name" disabled>Name</button></th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="car : ${cars}" class="car-row" data-list-entry th:attr="data-search=${car.name + ' ' + car.manufacturer}">
                    <td class="col-thumb"><img th:if="${car.imageUrl}" th:src="${car.imageUrl}" alt="" class="thumb-sm"><span th:unless="${car.imageUrl}" class="text-dim catalog-image-status">Not set</span></td>
                    <td th:text="${car.manufacturer}"></td>
                    <td><a th:href="@{/admin/cars/{id}/edit(id=${car.id})}" class="detail-link"><strong th:text="${car.name}"></strong></a></td>
                    <td class="actions">
                        <a th:href="@{/admin/cars/{id}/edit(id=${car.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <form th:action="@{/admin/cars/{id}/delete(id=${car.id})}" method="post"
                              onsubmit="return confirm('Really delete this car?')">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div id="noResults" data-list-empty hidden class="empty-state"><p>No matching cars. Try another search or reset the filters.</p></div>
        <div class="pagination pagination-bar" id="pagination" data-list-pagination hidden aria-label="Cars pagination">
            <span id="pageInfo" data-list-page-info class="text-dim"></span>
            <div class="actions">
                <button type="button" id="prevPage" data-list-prev class="btn btn-secondary btn-sm" disabled>Previous</button>
                <button type="button" id="nextPage" data-list-next class="btn btn-secondary btn-sm">Next</button>
            </div>
        </div>
        <div th:if="${cars.isEmpty()}" class="empty-state" data-list-initial-empty><p>No cars created yet.</p></div>
    </div>

    <script defer th:src="@{/admin/js/management-list.js}"></script>
</section>
</body>
</html>
