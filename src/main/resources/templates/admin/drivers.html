<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Drivers', ~{::section})}">
<body>
<section class="admin-list" data-admin-list data-page-size="20" data-unit="driver" data-plural="drivers">
    <div class="toolbar">
        <h1>Drivers</h1>
        <div class="actions">
            <a th:href="@{/admin/drivers/import}" class="btn btn-secondary">Import from Google Sheet</a>
        <a th:href="@{/admin/drivers/new}" class="btn btn-primary">+ New Driver</a>
        </div>
    </div>
    <p class="admin-list-intro text-dim">Manage driver identities and active status.</p>
    <div class="card admin-list-card">
        <div class="admin-list-controls" data-list-tools hidden>
            <label for="driverSearch"><span>Search</span><input type="search" id="driverSearch" data-list-search placeholder="PSN ID or nickname" autocomplete="off"></label>
            <label for="listStatus"><span>Status</span><select id="listStatus" data-list-status><option value="all">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
            <button type="button" class="btn btn-secondary" data-list-reset disabled>Reset filters</button>
            <p class="admin-list-count text-dim" data-list-count role="status"></p>
        </div>
        <div class="table-scroll" role="region" aria-label="Drivers list" tabindex="0">
        <table th:if="${!drivers.isEmpty()}" id="driversTable" data-list-table>
            <thead>
                <tr>
                    <th scope="col" class="sortable" data-col="0" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by PSN ID" disabled>PSN ID</button></th>
                    <th scope="col" class="sortable" data-col="1" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Nickname" disabled>Nickname</button></th>
                    <th scope="col" class="sortable" data-col="2" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Status" disabled>Status</button></th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="driver : ${drivers}" class="driver-row" data-list-entry th:attr="data-search=${driver.psnId + ' ' + (driver.nickname ?: '')},data-status=${driver.active ? 'active' : 'inactive'}">
                    <td><a th:href="@{/admin/drivers/{id}(id=${driver.id})}" class="detail-link"><strong th:text="${driver.psnId}"></strong></a></td>
                    <td th:text="${driver.nickname}"></td>
                    <td>
                        <span th:if="${driver.active}" class="badge badge-active">● Active</span>
                        <span th:unless="${driver.active}" class="badge badge-inactive">○ Inactive</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{/admin/drivers/{id}/edit(id=${driver.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <form th:action="@{/admin/drivers/{id}/delete(id=${driver.id})}" method="post"
                              onsubmit="return confirm('Really delete this driver?')">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div id="noResults" data-list-empty hidden class="empty-state"><p>No matching drivers. Try another search or reset the filters.</p></div>
        <div class="pagination pagination-bar" id="pagination" data-list-pagination hidden aria-label="Drivers pagination">
            <span id="pageInfo" data-list-page-info class="text-dim"></span>
            <div class="actions">
                <button type="button" id="prevPage" data-list-prev class="btn btn-secondary" disabled>Previous</button>
                <button type="button" id="nextPage" data-list-next class="btn btn-secondary">Next</button>
            </div>
        </div>
        <div th:if="${drivers.isEmpty()}" class="empty-state" data-list-initial-empty><p>No drivers created yet.</p></div>
    </div>

    <script defer th:src="@{/admin/js/management-list.js}"></script>
</section>
</body>
</html>
