<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section class="entity-editor">
    <div class="toolbar"><div><a th:href="@{/admin/tracks}" class="back-link">← Back to Tracks</a><h1 th:text="${trackForm.id != null ? 'Edit Track' : 'New Track'}"></h1></div></div>
    <nav class="entity-section-nav" aria-label="Track editing sections"><a href="#track-identity">Identity</a><a th:if="${trackForm.id != null}" href="#track-image">Image</a></nav>
    <div class="card">
        <form class="entity-editor-form" th:action="@{/admin/tracks/save}" th:object="${trackForm}" method="post">
            <input type="hidden" th:field="*{id}">
            <fieldset id="track-identity"><legend>Identity</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}" th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name') ? 'name-error' : null}" placeholder="e.g. Tsukuba Circuit" required>
                    <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" th:field="*{country}" placeholder="e.g. Japan">
                </div>
            </div>
            </fieldset>
            <div class="entity-editor-actions"><span class="text-dim">Track details</span><div class="actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/tracks}" class="btn btn-secondary">Cancel</a>
            </div></div>
        </form>
    </div>
    <div th:if="${trackForm.id != null}" class="card mt-md" id="track-image">
        <h2>Image</h2>
        <div th:if="${track != null && track.imageUrl != null}" class="mb-sm">
            <img th:src="${track.imageUrl}" th:alt="${track.name + ' image'}" class="preview-img">
        </div>
        <div th:if="${track == null || track.imageUrl == null}" class="empty-state empty-state--compact"><p>No image yet.</p></div>
        <form th:action="@{/admin/tracks/{id}/image(id=${trackForm.id})}" method="post" enctype="multipart/form-data" class="mt-xs">
            <div class="inline-form">
                <div class="form-group form-group--inline">
                    <label for="trackImage">Image file</label>
                    <input type="file" id="trackImage" name="image" accept="image/png,image/jpeg,image/webp,image/gif" required
                           class="file-input">
                    <small class="form-hint">PNG, JPG, WebP, GIF. Max 10 MB.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Upload</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
