<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section class="entity-editor">
    <div class="toolbar"><div><a th:href="@{/admin/cars}" class="back-link">← Back to Cars</a><h1 th:text="${carForm.id != null ? 'Edit Car' : 'New Car'}"></h1></div></div>
    <nav class="entity-section-nav" aria-label="Car editing sections"><a href="#car-identity">Identity</a><a th:if="${carForm.id != null}" href="#car-image">Image</a></nav>
    <div class="card">
        <form class="entity-editor-form" th:action="@{/admin/cars/save}" th:object="${carForm}" method="post">
            <input type="hidden" th:field="*{id}">
            <fieldset id="car-identity"><legend>Identity</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="manufacturer">Manufacturer</label>
                    <input type="text" id="manufacturer" th:field="*{manufacturer}" th:attr="aria-invalid=${#fields.hasErrors('manufacturer')},aria-describedby=${#fields.hasErrors('manufacturer') ? 'manufacturer-error' : null}" placeholder="e.g. Mazda" required>
                    <p id="manufacturer-error" class="field-error" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}"></p>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}" th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name') ? 'name-error' : null}" placeholder="e.g. RX-Vision GT3 Concept" required>
                    <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
            </div>
            </fieldset>
            <div class="entity-editor-actions"><span class="text-dim">Car details</span><div class="actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/cars}" class="btn btn-secondary">Cancel</a>
            </div></div>
        </form>
    </div>
    <div th:if="${carForm.id != null}" class="card mt-md" id="car-image">
        <h2>Image</h2>
        <div th:if="${car != null && car.imageUrl != null}" class="mb-sm">
            <img th:src="${car.imageUrl}" th:alt="${car.name + ' image'}" class="preview-img">
        </div>
        <div th:if="${car == null || car.imageUrl == null}" class="empty-state empty-state--compact"><p>No image yet.</p></div>
        <form th:action="@{/admin/cars/{id}/image(id=${carForm.id})}" method="post" enctype="multipart/form-data" class="mt-xs">
            <div class="inline-form">
                <div class="form-group form-group--inline">
                    <label for="carImage">Image file</label>
                    <input type="file" id="carImage" name="image" accept="image/png,image/jpeg,image/webp,image/gif" required
                           class="file-input">
                    <small class="form-hint">PNG, JPG, WebP, GIF. Max 10 MB.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Upload</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
