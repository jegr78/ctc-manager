<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Tracks', ~{::section})}">
<body>
<section class="admin-list catalog-list" data-admin-list data-page-size="20" data-unit="track" data-plural="tracks">
    <div class="toolbar">
        <h1>Tracks</h1>
        <div class="actions">
            <a th:href="@{/admin/tracks/new}" class="btn btn-primary">+ New Track</a>
        </div>
    </div>
    <p class="admin-list-intro text-dim">Manage circuits and layouts available for race setup.</p>
    <div class="card admin-list-card">
        <div class="admin-list-controls catalog-list-controls" data-list-tools hidden>
            <label for="trackSearch"><span>Search</span><input type="search" id="trackSearch" data-list-search placeholder="Track name or country" autocomplete="off"></label>
            <button type="button" class="btn btn-secondary" data-list-reset disabled>Reset filters</button>
            <p class="admin-list-count text-dim" data-list-count role="status"></p>
        </div>
        <div class="table-scroll" role="region" aria-label="Tracks list" tabindex="0">
        <table th:if="${!tracks.isEmpty()}" id="tracksTable" data-list-table>
            <thead>
                <tr>
                    <th scope="col" class="col-thumb">Image</th>
                    <th scope="col" class="sortable" data-col="1" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Name" disabled>Name</button></th>
                    <th scope="col" class="sortable" data-col="2" aria-sort="none"><button type="button" class="admin-sort-button" aria-label="Sort by Country" disabled>Country</button></th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="track : ${tracks}" class="track-row" data-list-entry th:attr="data-search=${track.name + ' ' + (track.country ?: '')}">
                    <td class="col-thumb"><img th:if="${track.imageUrl}" th:src="${track.imageUrl}" alt="" class="thumb-sm"><span th:unless="${track.imageUrl}" class="text-dim catalog-image-status">Not set</span></td>
                    <td><a th:href="@{/admin/tracks/{id}/edit(id=${track.id})}" class="detail-link"><strong th:text="${track.name}"></strong></a></td>
                    <td th:text="${track.country}"></td>
                    <td class="actions">
                        <a th:href="@{/admin/tracks/{id}/edit(id=${track.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <form th:action="@{/admin/tracks/{id}/delete(id=${track.id})}" method="post"
                              onsubmit="return confirm('Really delete this track?')">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div id="noResults" data-list-empty hidden class="empty-state"><p>No matching tracks. Try another search or reset the filters.</p></div>
        <div class="pagination pagination-bar" id="pagination" data-list-pagination hidden aria-label="Tracks pagination">
            <span id="pageInfo" data-list-page-info class="text-dim"></span>
            <div class="actions">
                <button type="button" id="prevPage" data-list-prev class="btn btn-secondary btn-sm" disabled>Previous</button>
                <button type="button" id="nextPage" data-list-next class="btn btn-secondary btn-sm">Next</button>
            </div>
        </div>
        <div th:if="${tracks.isEmpty()}" class="empty-state" data-list-initial-empty><p>No tracks created yet.</p></div>
    </div>

    <script defer th:src="@{/admin/js/management-list.js}"></script>
</section>
</body>
</html>
