<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<style th:replace="~{admin/trailer/fragments :: base}"></style>
<style>
  .photo { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11,11,11,.85) 0%, rgba(11,11,11,0) 34%),
                                                     linear-gradient(180deg, rgba(11,11,11,.55) 0%, rgba(11,11,11,0) 24%); }
  .tag { position: absolute; left: 112px; bottom: 120px; display: flex; height: 64px; font-family: "Barlow Condensed"; font-weight: 700;
         font-size: 36px; letter-spacing: 3px; }
  .tag .a { background: var(--yellow); color: #0b0b0b; padding: 0 22px; display: flex; align-items: center; flex: none; }
  .tag .b { background: #fff; color: #0b0b0b; padding: 0 22px; display: flex; align-items: center; max-width: 520px; }
  .carname { position: absolute; left: 112px; right: 112px; bottom: 200px; font-family: "Conthrax"; line-height: 1.05; }
  .carname.fit-l { font-size: 76px; }
  .carname.fit-m { font-size: 60px; }
  .carname.fit-s { font-size: 46px; }
  .standings { position: absolute; right: 112px; bottom: 120px; display: flex; height: 64px; align-items: center; gap: 18px;
               font-family: "Barlow Condensed"; font-weight: 700; font-size: 30px; letter-spacing: 3px; background: rgba(11,11,11,.8); padding: 0 22px; }
  .standings img { width: 48px; height: 48px; object-fit: contain; }
  .standings .vs { color: var(--yellow); }
</style>
</head>
<body th:class="${'layer-' + layer}">
<th:block th:if="${layer == 'background'}">
    <img class="photo" th:src="${carScene}" alt="">
    <div class="shade"></div>
</th:block>
<th:block th:if="${layer == 'foreground'}">
    <div th:replace="~{admin/trailer/fragments :: brand('small')}"></div>
    <div class="carname clip" th:classappend="${carNameSize}" th:text="${#strings.toUpperCase(carName)}">CAR</div>
    <div class="tag"><span class="a" th:text="${legLabel}">LEG 1</span><span class="b clip" th:text="${pairing}">HOM vs AWY</span></div>
    <div class="standings">
        <img th:if="${homeLogo != null}" th:src="${homeLogo}" alt=""><span th:text="${homeShort}">HOM</span>
        <span class="vs">VS</span>
        <span th:text="${awayShort}">AWY</span><img th:if="${awayLogo != null}" th:src="${awayLogo}" alt="">
    </div>
</th:block>
</body>
</html>
