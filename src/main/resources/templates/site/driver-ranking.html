<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{site/layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section>
    <header class="standings-heading brand-stage"><p class="season-brand">COMMUNITY TEAM CUP</p>
        <h1>Driver ranking</h1><p class="text-dim" th:text="${season.displayLabel}"></p>
    </header><nav th:if="${showPhaseTabs}" class="phase-tab-row" role="tablist" aria-label="Phase navigation">
        <div class="phase-tab-row-inner">
            <a th:each="t : ${phaseTabs}"
               th:href="@{${t.href}}"
               th:class="${t.active} ? 'phase-tab active' : 'phase-tab'"
               role="tab"
               th:attr="aria-selected=${t.active} ? 'true' : 'false', aria-controls=${t.ariaControlsId}"
               th:text="${t.label}">Tab</a>
        </div>
    </nav>
    <div class="section" th:replace="~{site/fragments/driver-ranking :: ranking(false)}"></div>
</section>
</body>
</html>
