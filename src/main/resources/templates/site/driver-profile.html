<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{site/layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section>
    <header class="driver-header profile-heading brand-stage">
        <p class="season-brand">COMMUNITY TEAM CUP</p>
        <h1 class="text-white" th:text="${driver.psnId}"></h1>
        <p class="text-dim" th:if="${driver.nickname != null and !#strings.isEmpty(driver.nickname)}" th:text="${driver.nickname}"></p>
        <p class="season-meta" th:text="${season.displayLabel}"></p>
        <p class="text-dim" th:if="${team != null}" th:text="'Team: ' + ${team.shortName} + ' — ' + ${team.name}"></p>
        <p class="text-dim driver-aliases" th:if="${driver.aliases != null and !driver.aliases.isEmpty()}">
            <span>Also known as: </span>
            <span th:each="alias, stat : ${driver.aliases}"><span th:text="${alias.alias}"></span><span th:if="${!stat.last}">, </span></span>
        </p>
    </header>

    <div class="section profile-statistics">
        <h2 class="section-title">Statistics</h2>
        <dl class="profile-metrics">
            <div><dt>Total points</dt><dd class="profile-total-points" th:text="${totalPoints}"></dd></div>
            <div><dt>Races</dt><dd class="profile-total-races" th:text="${totalRaces}"></dd></div>
            <div><dt>Average points</dt><dd th:text="${#numbers.formatDecimal(averagePoints, 1, 1)}"></dd></div>
            <div><dt>Best position</dt><dd th:text="${bestPosition != null ? 'P' + bestPosition : '-'}"></dd></div>
        </dl>
    </div>
    <th:block th:if="${!showPhaseBreakdown}" th:with="rows=${profileRows}, heading=${'Race History — ' + season.displayLabel}">
        <div th:insert="~{site/fragments/driver-history :: history}"></div>
    </th:block>
    <th:block th:if="${showPhaseBreakdown}" th:each="entry : ${profileRowsByPhase}" th:with="rows=${entry.value}, heading=${phaseHeadings[entry.key]}">
        <div th:insert="~{site/fragments/driver-history :: history}"></div>
    </th:block>
    <script defer th:src="${assetsPath + '/js/statistics.js'}"></script>
</section>
</body>
</html>
