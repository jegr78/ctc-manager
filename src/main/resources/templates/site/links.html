<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{site/layout :: layout('Links', ~{::section})}">
<body>
<section>
    <div class="section">
        <header class="standings-heading brand-stage">
            <p class="season-brand">COMMUNITY TEAM CUP</p>
            <h1>Community links</h1>
            <p class="text-dim">Follow the cup and connect with the community.</p>
        </header>
        <p th:if="${#lists.isEmpty(links)}" class="text-dim">No links configured.</p>
        <div th:unless="${#lists.isEmpty(links)}" class="link-grid">
            <article th:each="link : ${links}" class="link-card">
                <a th:href="${link.url}" target="_blank" rel="noopener" class="link-card-target">
                    <span class="link-card-name" th:text="${link.name}">Link name</span>
                    <span class="link-card-url" th:text="${link.url}">https://example.com</span>
                    <span class="link-card-action">Opens in a new tab <span aria-hidden="true">↗</span></span>
                </a>
            </article>
        </div>
    </div>
</section>
</body>
</html>
