<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" th:with="title=${title ?: 'CTC'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="${assetsPath + '/img/ctc-logo-white.png'}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="${assetsPath + '/img/ctc-logo-white.png'}">
    <title th:text="'CTC - ' + ${title}">Community Team Cup</title>
    <link rel="stylesheet" th:href="${assetsPath != null ? assetsPath + '/css/style.css' : '/assets/css/style.css'}">
    <script defer th:src="${assetsPath + '/js/navigation.js'}"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
    <nav class="nav" aria-label="Main navigation">
        <div class="nav-inner">
            <a th:href="${rootPath + '/index.html'}" class="nav-brand">
                <img th:src="${assetsPath != null ? assetsPath + '/img/ctc-logo-white.png' : '/assets/img/ctc-logo-white.png'}" alt="CTC" class="nav-logo">
                <span class="nav-brand-name">COMMUNITY<small>TEAM CUP</small></span>
            </a>
            <details class="site-menu">
                <summary aria-label="Main menu">Menu ☰</summary>
                <div class="nav-links">
                <a th:href="${rootPath + '/index.html'}"
                   th:class="${currentPage == 'home'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'home' ? 'page' : null}">Home</a>
                <a th:if="${activeSeasonSlug != null and !#strings.isEmpty(activeSeasonSlug)}"
                   th:href="${rootPath + '/season/' + activeSeasonSlug + '/standings.html'}"
                   th:class="${seasonSlug == activeSeasonSlug} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${seasonSlug == activeSeasonSlug ? 'location' : null}">Current season</a>
                <a th:href="${rootPath + '/teams.html'}"
                   th:class="${currentPage == 'teams'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'teams' ? 'page' : null}">Teams</a>
                <a th:href="${rootPath + '/drivers.html'}"
                   th:class="${currentPage == 'drivers'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'drivers' ? 'page' : null}">Drivers</a>
                <a th:href="${rootPath + '/alltime-standings.html'}"
                   th:class="${currentPage == 'alltime-standings'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'alltime-standings' ? 'page' : null}">Standings</a>
                <a th:href="${rootPath + '/alltime-driver-ranking.html'}"
                   th:class="${currentPage == 'alltime-driver-ranking'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'alltime-driver-ranking' ? 'page' : null}">Driver Ranking</a>
                <a th:href="${rootPath + '/archive.html'}"
                   th:class="${currentPage == 'archive'} ? 'nav-link-active' : ''"
                   th:attr="aria-current=${currentPage == 'archive' ? 'page' : null}">Archive</a>
                </div>
            </details>
        </div>
    </nav>
    <nav class="subnav" aria-label="Season navigation" th:if="${seasonSlug != null and !#strings.isEmpty(seasonSlug)}">
        <div class="subnav-inner">
            <a th:href="${rootPath + '/season/' + seasonSlug + '/standings.html'}"
               th:class="${currentPage == 'standings'} ? 'subnav-link active' : 'subnav-link'"
               th:attr="aria-current=${currentPage == 'standings' ? 'page' : null}">Standings</a>
            <a th:href="${rootPath + '/season/' + seasonSlug + '/matchdays.html'}"
               th:class="${currentPage == 'matchdays'} ? 'subnav-link active' : 'subnav-link'"
               th:attr="aria-current=${currentPage == 'matchdays' ? 'page' : null}">Matchdays</a>
            <a th:href="${rootPath + '/season/' + seasonSlug + '/driver-ranking.html'}"
               th:class="${currentPage == 'driver-ranking'} ? 'subnav-link active' : 'subnav-link'"
               th:attr="aria-current=${currentPage == 'driver-ranking' ? 'page' : null}">Driver Ranking</a>
            <a th:if="${hasPlayoff}"
               th:href="${rootPath + '/season/' + (playoffSeasonSlug != null ? playoffSeasonSlug : seasonSlug) + '/playoff.html'}"
               th:class="${currentPage == 'playoff'} ? 'subnav-link active' : 'subnav-link'"
               th:attr="aria-current=${currentPage == 'playoff' ? 'page' : null}">Playoff</a>
        </div>
    </nav>
    <nav class="breadcrumb" aria-label="breadcrumb"
         th:if="${breadcrumbCurrent != null and !#strings.isEmpty(breadcrumbCurrent)}">
        <a class="breadcrumb-link" th:href="${rootPath + '/index.html'}">Home</a>
        <th:block th:if="${seasonSlug != null and !#strings.isEmpty(seasonSlug)}">
            <span class="breadcrumb-sep" aria-hidden="true"> &gt; </span>
            <a class="breadcrumb-link"
               th:href="${rootPath + '/season/' + seasonSlug + '/standings.html'}"
               th:text="${seasonName}">Season</a>
        </th:block>
        <span class="breadcrumb-sep" aria-hidden="true"> &gt; </span>
        <span class="breadcrumb-current" aria-current="page" th:text="${breadcrumbCurrent}">Page</span>
    </nav>
    <main class="main" id="main-content" tabindex="-1">
        <div th:replace="${content}"></div>
    </main>
    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Top</a>
            <span class="footer-sep" aria-hidden="true">&middot;</span>
            <a th:href="${rootPath + '/archive.html'}" class="footer-link">Archive</a>
            <span th:if="${activeSeasonSlug != null and !#strings.isEmpty(activeSeasonSlug)}"
                  class="footer-sep" aria-hidden="true">&middot;</span>
            <a th:if="${activeSeasonSlug != null and !#strings.isEmpty(activeSeasonSlug)}"
               th:href="${rootPath + '/season/' + activeSeasonSlug + '/standings.html'}"
               th:text="${activeSeasonName}"
               class="footer-link"></a>
        </div>
        <p>Community Team Cup &mdash; <a href="https://www.youtube.com/@CommunityTeamCup"
           class="footer-link"
           target="_blank"
           rel="noopener">YouTube</a></p>
    </footer>
</body>
</html>
