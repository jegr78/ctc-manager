<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{site/layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section>
    <header class="standings-heading brand-stage">
        <p class="season-brand">COMMUNITY TEAM CUP</p>
        <h1>Matchdays</h1>
        <p class="text-dim" th:text="${season.displayLabel}"></p>
    </header><nav th:if="${showPhaseTabs}" class="phase-tab-row" role="tablist" aria-label="Phase navigation">
        <div class="phase-tab-row-inner">
            <a th:each="t : ${phaseTabs}"
               th:href="@{${t.href}}"
               th:class="${t.active} ? 'phase-tab active' : 'phase-tab'"
               role="tab"
               th:attr="aria-selected=${t.active} ? 'true' : 'false', aria-controls=${t.ariaControlsId}"
               th:text="${t.label}">Tab</a>
        </div>
    </nav><nav th:if="${showGroupTabs}" class="group-tab-row" role="tablist" aria-label="Group navigation">
        <div class="group-tab-row-inner">
            <a th:each="g : ${groupTabs}"
               th:href="@{${g.href}}"
               th:class="${g.active} ? 'group-tab active' : 'group-tab'"
               role="tab"
               th:attr="aria-selected=${g.active} ? 'true' : 'false', aria-controls=${g.ariaControlsId}"
               th:text="${g.label}">Group</a>
        </div>
    </nav>
    <div class="section">
        <div th:if="${matchdays != null and !matchdays.isEmpty()}" class="matchday-index">
            <a th:each="md : ${matchdays}" class="matchday-link"
               th:href="${matchdayLinkMap.get(md.id)}">
                <span><strong th:text="${md.label}"></strong><span class="matchday-link-caption">Races and driver results</span></span>
                <span aria-hidden="true">→</span>
            </a>
        </div>
        <p th:if="${matchdays == null or matchdays.isEmpty()}" class="text-dim">No matchdays recorded for this season.</p>
    </div>
</section>
</body>
</html>
